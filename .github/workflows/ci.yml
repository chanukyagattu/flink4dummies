name: CI

on:
  pull_request:
  push:
    branches-ignore: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with: {fetch-depth: 0}
      - uses: actions/setup-node@v5
        with: {node-version: 22, cache: npm}
      - run: npm ci
      # onBrokenLinks and markdown.hooks.onBrokenMarkdownLinks are set to
      # 'throw', so a broken link fails the build rather than shipping.
      - run: npm run build
      - run: npm run typecheck
